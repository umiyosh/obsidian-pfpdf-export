name: Release

# Obsidian looks up a release by a tag equal to manifest.json's version, so tags have no "v".
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write # store the build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release is built only from the lockfile, not from another ref's cache.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check versions
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$TAG"
      - name: Install dependencies
        run: npm ci
      - name: Checks and build
        run: make check
      - name: Attest build provenance
        # Without a predicate or SBOM input, actions/attest creates SLSA build provenance.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(main.js manifest.json)
          # The plugin has no stylesheet today; attach one if it is ever added.
          if [ -f styles.css ]; then files+=(styles.css); fi
          gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "$TAG" --generate-notes
